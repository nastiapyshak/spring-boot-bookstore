databaseChangeLog:
  - changeSet:
      id: assign-roles-to-existing-users
      author: anastasiia
      changes:
        - sql:
            sql: |
              INSERT INTO users_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u
              JOIN roles r ON r.name = 'ADMIN'
              WHERE u.email = 'john.doe@example.com'
              AND NOT EXISTS (
                SELECT 1
                FROM users_roles ur
                WHERE ur.user_id = u.id
                  AND ur.role_id = r.id
              );

              INSERT INTO users_roles (user_id, role_id)
              SELECT u.id, r.id
              FROM users u
              JOIN roles r ON r.name = 'USER'
              WHERE u.email = 'duplicate.user@example.com'
              AND NOT EXISTS (
                SELECT 1
                FROM users_roles ur
                WHERE ur.user_id = u.id
                  AND ur.role_id = r.id
              );
